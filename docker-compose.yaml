services:
  postgres:
    build:
      context: .
      dockerfile: postgres.Dockerfile
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Coolify}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Coolify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  comments-app:
    build:
      context: ./comments-app
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      TZ: Europe/Moscow
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in Coolify}
      ADMIN_USERS: ${ADMIN_USERS:?Set ADMIN_USERS in Coolify}
      ADMIN_CHAT_IDS: ${ADMIN_CHAT_IDS:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in Coolify}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in Coolify}
    volumes:
      - comments_data:/data
      - product_uploads:/app/static/products/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  max-bot:
    build:
      context: ./alex-kitchen-go-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in Coolify}
      PRICE_BOT_URL: ${PRICE_BOT_URL:-}
      BOT_LINK: ${BOT_LINK:-}
      BOT_URL: ${BOT_URL:-}
      COMMENTS_APP_URL: ${COMMENTS_APP_URL:?Set COMMENTS_APP_URL in Coolify}
      COMMENTS_BASE_URL: ${COMMENTS_BASE_URL:-}
      COMMENTS_ENABLED: ${COMMENTS_ENABLED:-true}
      ADMIN_CHAT_IDS: ${ADMIN_CHAT_IDS:-}
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      PUBLIC_CHAT_ID: ${PUBLIC_CHAT_ID:-}
      BROADCAST_HOUR: ${BROADCAST_HOUR:-10}
      BROADCAST_MINUTE: ${BROADCAST_MINUTE:-0}
    volumes:
      - bot_data:/data
    depends_on:
      comments-app:
        condition: service_healthy

volumes:
  postgres_data:
  comments_data:
  bot_data:
  product_uploads:
